<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thông tin tài khoản - Spring Boot REST API</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow border-0" style="border-radius: 12px; overflow: hidden;">

                    <h5 class="mb-0 fw-bold">Thông Tin Người Dùng</h5>
                </div>

                    <div class="mb-3">

                    </div>
                    <p class="text-muted mb-1">Xin chào,</p>
                    <h3 id="profile" class="text-dark fw-bold mb-4">Đang tải...</h3>
                    <div id="feedback" class="text-danger mb-3"></div>
                    <button id="logout" class="btn btn-outline-danger px-4 fw-semibold">Đăng Xuất</button>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="/js/mainjs.js"></script>
